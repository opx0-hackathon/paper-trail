name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
      - name: wait for ci to pass on this commit
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-regexp: '^(api|web)$'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success

  deploy:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: load ssh key + trust the host
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: ship the tree, then build + restart the container
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -e
          PORT="${PORT:-22}"
          tar czf - \
            --exclude='.venv' --exclude='node_modules' --exclude='web/dist' \
            --exclude='web/tsconfig.tsbuildinfo' --exclude='__pycache__' \
            --exclude='.mypy_cache' --exclude='.ruff_cache' --exclude='.pytest_cache' \
            --exclude='.git' --exclude='papertrail.db' --exclude='.env' \
            . | ssh -i ~/.ssh/deploy -p "$PORT" "$USER@$HOST" \
              'set -e; cd ~/sa/paper-trail && tar xzf - && bash deploy/deploy.sh'

      - name: smoke test from outside
        run: |
          set -e
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://trail.opxz.dev/healthz)
            state=$(curl -s -o /dev/null -w "%{http_code}" https://trail.opxz.dev/api/state)
            echo "attempt $i: /healthz=$code /api/state=$state"
            [ "$code" = "200" ] && [ "$state" = "200" ] && exit 0
            sleep 5
          done
          echo "endpoints not 200 after 5 tries"
          exit 1
